services:
  postgres:
    image: postgres:16-alpine
    container_name: hunger-arena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hunger
      POSTGRES_PASSWORD: hunger
      POSTGRES_DB: hunger_arena
    ports:
      - "5432:5432"
    volumes:
      - hunger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunger -d hunger_arena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hunger_pgdata:
