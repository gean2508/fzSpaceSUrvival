[package]
name = "hunger-arena-desktop"
version = "0.1.0"
description = "Hunger Arena — native Linux desktop client"
authors = ["Hunger Arena"]
edition = "2021"

[lib]
name = "hunger_arena_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
