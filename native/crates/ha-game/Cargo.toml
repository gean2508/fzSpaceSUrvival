[package]
name = "ha-game"
description = "Hunger Arena native client — Bevy ECS + Ghibli toon shaders"
version.workspace = true
edition.workspace = true

[lib]
name = "ha_game"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "ha-game"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
ha-shared = { path = "../ha-shared" }
ha-assets = { path = "../ha-assets" }
ha-audio = { path = "../ha-audio" }
iafz-sys = { path = "../iafz-sys" }
bevy.workspace = true
serde = { workspace = true }
serde_json = "1"
# Para preguntarle a la fuente EMBARCADA que glifos trae (`fuente::dibujable`).
# Ya venia en el arbol por `bevy_text`, asi que no agrega compilacion.
ab_glyph = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
raw-window-handle = "0.6"

[features]
default = ["desktop"]
desktop = []
android = []

[dev-dependencies]
tempfile = "3"
