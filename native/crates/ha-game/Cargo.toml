[package]
name = "ha-game"
description = "Hunger Arena native client — Bevy ECS + Ghibli toon shaders"
version.workspace = true
edition.workspace = true

[lib]
name = "ha_game"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "ha-game"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
ha-shared = { path = "../ha-shared" }
bevy.workspace = true
serde = { workspace = true }
serde_json = "1"
gltf = "1.4"

[features]
default = ["desktop"]
desktop = []
android = []

[dev-dependencies]
tempfile = "3"
