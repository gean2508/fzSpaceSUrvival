[package]
name = "ha-asset-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Herramientas de dev (F2 scan; F3 egui más adelante). Nunca entra al APK: el
# build de release apunta a ha-game, no al workspace entero.
[[bin]]
name = "ha-asset-tools"
path = "src/main.rs"

[dependencies]
ha-assets = { path = "../ha-assets", features = ["scan"] }
# GUI standalone (F3) — corre SOLO en desarrollo, nunca junto al juego.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
# Selector de carpeta nativo. Backend xdg-portal (COSMIC/Pop!_OS lo tiene) — sin
# dependencia de libs GTK de desarrollo.
# async-std (no tokio): el diálogo síncrono se autogestiona sin necesitar un
# runtime Tokio ambiente (con "tokio" panicteaba "no reactor running").
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
