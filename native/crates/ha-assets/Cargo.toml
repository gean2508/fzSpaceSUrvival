[package]
name = "ha-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Headless: sin Bevy a propósito — lo consumen la CLI (ha-asset-tools), el
# server (F7) y los tests, sin arrastrar el motor. El puente Bevy vive en ha-game.
[dependencies]
serde = { workspace = true }
ron = "0.8"
# Sólo el escaneo (F2) necesita leer PNGs. Feature-gated para que el server (F7)
# y ha-game no arrastren el decoder de imágenes.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
scan = ["dep:image"]
