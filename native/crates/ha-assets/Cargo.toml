[package]
name = "ha-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Headless: sin Bevy a propósito — lo consumen HA Studio, ha-game y los tests,
# sin arrastrar el motor. El puente Bevy vive en ha-game.
[dev-dependencies]
# Sólo para el test de paridad slot<->colocable: el catálogo del juego vive en
# ha-shared y este crate NO puede depender de él en runtime (el editor tiene que
# poder abrir sin el juego). Como dev-dep no entra al binario y aun así impide
# que las dos listas se separen.
ha-shared = { path = "../ha-shared" }

[dependencies]
serde = { workspace = true }
serde_json = "1"
