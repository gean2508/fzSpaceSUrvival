plugins {
    alias(libs.plugins.android.application)
}

def versionCodeProp = project.findProperty("versionCode") ?: "1"
def versionNameProp = project.findProperty("versionName") ?: "1.0.0"

android {
    namespace 'com.hungerarena.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hungerarena.app"
        minSdk 24
        targetSdk 34
        versionCode versionCodeProp.toInteger()
        versionName versionNameProp
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
    sourceSets {
        main {
            assets.srcDirs += files('../../crates/ha-game/assets')
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.games.activity
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
