name: Build Native Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "native/**"
      - "packages/shared/**"
      - "scripts/ship-native-android.mjs"
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: npm install
        run: npm ci

      - name: Install cargo-apk
        run: cargo install cargo-ndk cargo-apk

      - name: Build & publish APK artifact
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          UPDATE_BASE_URL: http://127.0.0.1:2567
        run: node scripts/ship-native-android.mjs --no-bump --host 127.0.0.1

      - uses: actions/upload-artifact@v4
        with:
          name: hunger-arena-apk
          path: |
            server/updates/artifacts/hunger-arena.apk
            client/public/downloads/hunger-arena.apk
